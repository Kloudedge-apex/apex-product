# Apex CI — gates on the path to prod (audit B7).
#
# The source-controlled manual production workflow remains fail-closed until
# its external GitHub environment, OIDC federation, RBAC, signer pin, and
# migration evidence are provisioned. This CI workflow does NOT deploy: it
# blocks the ship path by requiring pushes to master and release/**, and PRs
# targeting either, to pass lint/type-check/build, the API test suite, the
# hermetic synthetic migration rehearsal, and an exact-image API/worker boot.

name: CI

on:
  push:
    branches:
      - master
      - "release/**"
  pull_request:
    branches:
      - master
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  lint-typecheck-build:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify protected production release workflow
        run: scripts/verify-production-release-workflow.sh

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Test release scripts
        run: bash scripts/tests/release-scripts.test.sh

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

  test:
    name: API Tests (blocking)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # pnpm version is read from the root package.json `packageManager` field.
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Type check
        run: pnpm type-check

      - name: Run API tests
        working-directory: apps/api
        run: pnpm vitest run

  migration-rehearsal:
    name: Migration Rehearsal (blocking)
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:84a355869251af1a3379cfc9fa7b4dbf962c03f642a4bb7b339a203925071c43
        env:
          POSTGRES_USER: workforce_rehearsal
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: workforce_rehearsal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workforce_rehearsal -d workforce_rehearsal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout complete candidate history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null || ! command -v pg_dump >/dev/null ||
            ! command -v pg_restore >/dev/null || ! command -v createdb >/dev/null ||
            ! command -v dropdb >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-client
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rehearse exact migration candidate
        env:
          DATABASE_URL: postgresql://workforce_rehearsal:synthetic_ci_only@127.0.0.1:5432/workforce_rehearsal_ci
          WORKFORCE_MIGRATION_REHEARSAL_ACK: ci-synthetic-only
          WORKFORCE_REHEARSAL_VECTOR_MODE: native
        run: >-
          scripts/rehearse-migration-candidate.sh
          "${{ github.sha }}"
          "${RUNNER_TEMP}/ci-migration-rehearsal-receipt.json"

      - name: Verify sanitized rehearsal receipt
        run: >-
          scripts/verify-ci-migration-rehearsal-receipt.sh
          "${RUNNER_TEMP}/ci-migration-rehearsal-receipt.json"
          "${{ github.sha }}"

      - name: Build exact production runtime candidate
        env:
          IMAGE: workforce-os-api:runtime-ci-${{ github.sha }}
        run: >-
          docker build
          --build-arg VCS_REF=${{ github.sha }}
          --file apps/api/Dockerfile
          --tag "${IMAGE}"
          .

      - name: Rehearse API and worker production runtime
        env:
          DATABASE_URL: postgresql://workforce_rehearsal:synthetic_ci_only@127.0.0.1:5432/workforce_rehearsal_ci
          REDIS_URL: redis://127.0.0.1:6379/15
          IMAGE: workforce-os-api:runtime-ci-${{ github.sha }}
          WORKFORCE_RUNTIME_REHEARSAL_ACK: ci-synthetic-only
        run: >-
          bash scripts/rehearse-runtime-candidate.sh
          "${IMAGE}"
          "${{ github.sha }}"
          "${RUNNER_TEMP}/ci-migration-rehearsal-receipt.json"
          "${RUNNER_TEMP}/ci-runtime-rehearsal-receipt.json"

      - name: Run production runtime rehearsal adversary tests
        run: bash scripts/tests/runtime-rehearsal.test.sh "${{ github.sha }}"

      - name: Run migration rehearsal adversary tests
        env:
          MIGRATION_REHEARSAL_DATABASE_ADMIN_URL: postgresql://workforce_rehearsal:synthetic_ci_only@127.0.0.1:5432/postgres
          WORKFORCE_MIGRATION_REHEARSAL_TESTS_ACK: ci-synthetic-only
        run: >-
          scripts/tests/migration-rehearsal.test.sh
          "${RUNNER_TEMP}/ci-migration-rehearsal-receipt.json"
          "${{ github.sha }}"

      - name: Upload sanitized non-authoritative receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-migration-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/ci-migration-rehearsal-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload sanitized non-authoritative runtime receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-runtime-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/ci-runtime-rehearsal-receipt.json
          if-no-files-found: error
          retention-days: 14

  container-image:
    name: Production Image Contract
    needs:
      - lint-typecheck-build
      - migration-rehearsal
      - test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build production API/worker image
        env:
          IMAGE: workforce-os-api:ci-${{ github.sha }}
        run: >-
          docker build
          --build-arg VCS_REF=${{ github.sha }}
          --file apps/api/Dockerfile
          --tag "${IMAGE}"
          .

      - name: Verify production image contract
        env:
          IMAGE: workforce-os-api:ci-${{ github.sha }}
        run: scripts/verify-api-image.sh "${IMAGE}" "${{ github.sha }}"
