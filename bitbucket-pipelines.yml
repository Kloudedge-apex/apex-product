# Apex backend CI/CD
#
# Pull requests → install, lint, type-check, test.
# Push to master → tests, then build image via `az acr build` and freeze its
# manifest digest. Production rollout is only through `scripts/deploy-prod.sh`,
# which pulls the exact digest and runs the image contract before changing
# either Container App.
#
# Required variables in a deployment environment named
# `production-image-build` (not repository/workspace variables):
#
#   AZURE_ACR_BUILD_CLIENT_ID   Federated application client ID
#   AZURE_TENANT_ID             Azure AD tenant ID
#
# Configure Bitbucket OIDC federation and restrict this deployment environment
# to trusted master builds. The identity receives only the ACR data/task roles
# needed to queue a build and push its output to ledgracr. It must not receive
# Container Apps Contributor or any production runtime permission. No client
# secret is stored in Bitbucket, and pull-request steps receive no Azure token.
#
# DB schema changes are NOT touched by CI — keep the existing
# firewall-open → diff → approve → push → close workflow manual.

image: node:24-bookworm

definitions:
  caches:
    pnpm-store: $BITBUCKET_CLONE_DIR/.pnpm-store
  steps:
    - step: &install-and-test
        name: Install + lint + type-check + test
        caches:
          - pnpm-store
        script:
          - apt-get update && apt-get install -y --no-install-recommends jq openssl openssh-client && rm -rf /var/lib/apt/lists/*
          - corepack enable
          - corepack prepare pnpm@10.28.2 --activate
          - pnpm config set store-dir $BITBUCKET_CLONE_DIR/.pnpm-store
          - pnpm install --frozen-lockfile
          - pnpm --filter @apex/db exec prisma generate
          - pnpm lint
          - pnpm type-check
          - pnpm --filter @apex/api exec vitest run --reporter=default
          - bash scripts/tests/release-scripts.test.sh

    - step: &build-image
        name: Build image and push to ACR
        image: mcr.microsoft.com/azure-cli:2.89.1@sha256:f2e73db53c04ca82a675f1ecaa7051c42886932d45656789f90038673a42db9a
        oidc: true
        deployment: production-image-build
        script:
          - test -n "$AZURE_ACR_BUILD_CLIENT_ID" && test -n "$AZURE_TENANT_ID" && test -n "$BITBUCKET_STEP_OIDC_TOKEN"
          - az login --service-principal --username "$AZURE_ACR_BUILD_CLIENT_ID" --tenant "$AZURE_TENANT_ID" --federated-token "$BITBUCKET_STEP_OIDC_TOKEN" --output none
          # Full-SHA traceability only. Mutable timestamp/latest aliases are
          # not deployment inputs. This fresh Bitbucket step receives the
          # immutable clone for BITBUCKET_COMMIT and no prior build artifacts.
          - >
            export ACR_RUN_ID="$(az acr build
            --registry ledgracr
            --image 'apex-api:{{.Run.ID}}'
            --image apex-api:$BITBUCKET_COMMIT
            --build-arg VCS_REF=$BITBUCKET_COMMIT
            --file apps/api/Dockerfile
            --platform linux/amd64
            --no-logs
            --query runId
            --output tsv
            "$BITBUCKET_CLONE_DIR")"
          - printf '%s\n' "$ACR_RUN_ID" | grep -Eq '^[a-z0-9]+$'
          - test "$(az acr task show-run --registry ledgracr --run-id "$ACR_RUN_ID" --query status --output tsv)" = Succeeded
          - >
            export IMAGE_DIGEST="$(az acr task show-run
            --registry ledgracr
            --run-id "$ACR_RUN_ID"
            --query "outputImages[?repository=='apex-api' && tag=='$ACR_RUN_ID'].digest | [0]"
            --output tsv)"
          - printf '%s\n' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          - >
            test "$(az acr task show-run
            --registry ledgracr
            --run-id "$ACR_RUN_ID"
            --query "outputImages[?repository=='apex-api' && tag=='$BITBUCKET_COMMIT'].digest | [0]"
            --output tsv)" = "$IMAGE_DIGEST"
          - printf '%s\n' "$ACR_RUN_ID" > image-run-id.txt
          - printf '%s\n' "$IMAGE_DIGEST" > image-digest.txt
        artifacts:
          - image-run-id.txt
          - image-digest.txt

pipelines:
  pull-requests:
    '**':
      - step: *install-and-test

  branches:
    master:
      - step: *install-and-test
      - step: *build-image

    'phase-2.5-*':
      - step: *install-and-test

    # Prod ships from release/go-live-* (manual `az acr build` + containerapp
    # roll — see scripts/deploy-prod.sh), so the release branch gets the same
    # blocking test gate as master. Build/deploy stays manual on purpose.
    'release/go-live-*':
      - step: *install-and-test
