# Apex CI — gates on the path to prod (audit B7).
#
# Prod ships from release/go-live-* via manual `az acr build` +
# `az containerapp update` (see scripts/deploy-prod.sh). This workflow does
# NOT deploy — it blocks the ship path: pushes to master and release/**, and
# PRs targeting either, must pass lint/type-check/build AND the API test
# suite before an image may be built from that commit.

name: CI

on:
  push:
    branches:
      - master
      - "release/**"
  pull_request:
    branches:
      - master
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  lint-typecheck-build:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Test release scripts
        run: bash scripts/tests/release-scripts.test.sh

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

  test:
    name: API Tests (blocking)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # pnpm version is read from the root package.json `packageManager` field.
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Type check
        run: pnpm type-check

      - name: Run API tests
        working-directory: apps/api
        run: pnpm vitest run

  container-image:
    name: Production Image Contract
    needs:
      - lint-typecheck-build
      - test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build production API/worker image
        env:
          IMAGE: workforce-os-api:ci-${{ github.sha }}
        run: >-
          docker build
          --build-arg VCS_REF=${{ github.sha }}
          --file apps/api/Dockerfile
          --tag "${IMAGE}"
          .

      - name: Verify production image contract
        env:
          IMAGE: workforce-os-api:ci-${{ github.sha }}
        run: scripts/verify-api-image.sh "${IMAGE}" "${{ github.sha }}"
