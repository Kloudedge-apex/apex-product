name: Promote Workforce OS production domains

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Prepare hostnames first; bind only after certificates succeed"
        required: true
        type: choice
        options:
          - prepare
          - bind
      confirmation:
        description: "Type the exact confirmation phrase for the selected phase"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: workforce-os-production-domain-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Bind production custom domains
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: workforce-os-production

    steps:
      - name: Validate protected manual authority
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
          PHASE: ${{ inputs.phase }}
          REF_PROTECTED: ${{ github.ref_protected }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ||
            "${GITHUB_REF}" != "refs/heads/master" ||
            "${REF_PROTECTED}" != "true" ||
            ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: domain promotion requires protected master and exact confirmation" >&2
            exit 1
          fi
          case "${PHASE}:${CONFIRMATION}" in
            "prepare:PREPARE WORKFORCE OS PUBLIC DOMAINS"|\
            "bind:PROMOTE WORKFORCE OS PUBLIC DOMAINS") ;;
            *)
              echo "ERROR: selected phase and confirmation do not match" >&2
              exit 1
              ;;
          esac
          branch_json="$(gh api "repos/${GITHUB_REPOSITORY}/branches/master")"
          jq -e --arg sha "${WORKFLOW_SHA}" \
            '.protected == true and .commit.sha == $sha' >/dev/null <<<"${branch_json}"

      - name: Checkout exact protected master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify reviewed certificate package
        run: node scripts/verify-production-isolation-package.mjs

      - name: Authenticate exact backend release identity
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: 2efd64b0-87c1-43a7-a064-30679ce8b764
          tenant-id: d4b3813d-146f-4d03-96b8-d6e5862d58a2
          subscription-id: 3171575e-f164-425c-9ee0-2fb10cf93884

      - name: Verify exact production package without mutation
        env:
          PHASE: ${{ inputs.phase }}
        run: scripts/promote-production-custom-domains.sh --phase "${PHASE}"

      - name: Apply reviewed production domain phase
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PHASE: ${{ inputs.phase }}
        run: |
          scripts/promote-production-custom-domains.sh \
            --phase "${PHASE}" \
            --apply \
            --confirmation "${CONFIRMATION}"
